<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>福岡生日旅</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{--bg:#f3f8fc;--card:#fff;--ink:#23364a;--sub:#7b8fa3;--line:#e2ecf4;--blue:#7fb6de;--blue2:#dcecf8;--pink:#f4b6bf;--mint:#a9d9c6;--sun:#f5d99a;--lav:#c9c3ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding-bottom:88px}
header{padding:22px 22px 8px;display:flex;justify-content:space-between;align-items:flex-start}
h1{margin:0;font-size:26px;font-weight:600;letter-spacing:.12em}
.sub{font-size:12px;color:var(--sub);letter-spacing:.08em;margin-top:4px}
.badge{font-size:11px;background:var(--blue2);color:var(--ink);padding:6px 12px;border-radius:99px;margin-top:4px}
.hero{margin:10px 18px 4px;padding:18px 20px;border-radius:22px;background:linear-gradient(135deg,var(--blue2),#f7e6ea 120%);position:relative;overflow:hidden}
.hero b{font-size:15px;font-weight:600}.hero p{margin:6px 0 0;font-size:12px;color:var(--sub);line-height:1.6}
.hero .cake{position:absolute;right:16px;top:10px;font-size:34px}
.days{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:74px;padding:9px 0;text-align:center;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--sub);cursor:pointer;font-size:11px}
.day strong{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-top:2px}
.day.on{background:var(--blue);border-color:var(--blue);color:#fff}.day.on strong{color:#fff}
.dtitle{padding:12px 22px 4px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.dtitle small{color:var(--sub);font-weight:400;font-size:12px}
.tl{padding:8px 18px 0}
.item{display:flex;gap:12px;position:relative}
.time{width:44px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--sub);padding-top:14px;text-align:right}
.rail{position:relative;width:14px;flex:0 0 14px}
.rail:before{content:"";position:absolute;left:6px;top:0;bottom:-8px;width:2px;background:var(--line)}
.item:last-child .rail:before{bottom:50%}
.dot{position:absolute;left:1px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--c)}
.card{flex:1;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer;transition:opacity .2s}
.card.traffic-card{padding:8px 12px;margin-bottom:6px;border-style:dashed}
.card h3{margin:0;font-size:14.5px;font-weight:600}
.card p{margin:4px 0 0;font-size:12px;color:var(--sub);line-height:1.6}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:99px;background:var(--c);color:#3a3a3a;margin-bottom:6px;opacity:.9}
.item.done .card{opacity:.45}.item.done h3{text-decoration:line-through}
.sec{padding:8px 22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 16px;margin:10px 18px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border:0}
.chk{width:22px;height:22px;border-radius:8px;border:2px solid var(--blue);flex:0 0 22px;display:grid;place-items:center;color:#fff;font-size:13px;cursor:pointer}
.row.on .chk{background:var(--blue)}.row.on span{color:var(--sub);text-decoration:line-through}
.h2{padding:16px 22px 0;font-size:13px;color:var(--sub);letter-spacing:.1em}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}.kv:last-child{border:0}.kv em{font-style:normal;color:var(--sub)}
.add{display:flex;gap:8px;padding:10px 0}
.add input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;min-width:0}
.add button,.btn{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:0 16px;font-size:13px;cursor:pointer}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--sub);font-size:11px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--blue);font-weight:600}
.view{display:none}.view.on{display:block}
.total{font-size:22px;font-weight:600;padding:14px 22px 0}
.plus{border:0;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.x{color:var(--sub);cursor:pointer;margin-left:8px;font-style:normal}
.nt{display:block;color:var(--sub);font-size:11.5px;margin-top:2px;line-height:1.5}
a{color:var(--blue);text-decoration:none}
.md{position:fixed;inset:0;background:rgba(20,35,50,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}.md.on{display:flex}
.sheet{width:100%;max-width:480px;max-height:82vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;justify-content:space-between;align-items:center;font-size:16px}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:12px;padding:8px 0;font-size:13px;cursor:pointer}.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.col{flex-direction:column}.col button{padding:10px}
.dt{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 8px;font-size:13px}
.kv span{text-align:right;max-width:68%}
.ib{border:1px solid var(--line);background:var(--card);width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;padding:0}
.pg{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;overflow:auto;padding-top:env(safe-area-inset-top,0px)}.pg.on{display:block}
.pgw{max-width:480px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.pgh{display:flex;align-items:center;gap:12px;padding:16px 18px 6px;font-size:18px;font-weight:600}
.pgh button{border:1px solid var(--line);background:var(--card);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink);padding:0}
.lang{display:flex;gap:8px;align-items:center;padding:10px 18px}
.lang select{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;font-size:14px;min-width:0}
.lang button{width:40px;height:40px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:16px;cursor:pointer}
.tin{display:block;width:calc(100% - 36px);margin:0 18px 10px;min-height:90px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:12px;font:inherit;font-size:15px;resize:vertical}
.go{display:block;width:calc(100% - 36px);margin:0 18px;border:0;background:var(--blue);color:#fff;border-radius:14px;padding:12px;font-size:14px;cursor:pointer}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:8px 18px}
.pc.traffic-item-1{background:linear-gradient(135deg,#f0f7ff,#e6f2ff);border-color:#b9daf8;}
.pc.traffic-item-2{background:linear-gradient(135deg,#f5fcf5,#e8f7ec);border-color:#b8ebd0;}
.pc.traffic-item-3{background:linear-gradient(135deg,#fdfaf3,#f7edd8);border-color:#f1dec0;}
.src{font-size:12.5px;color:var(--sub);margin-top:6px}.dst{font-size:16px;font-weight:600;margin-top:4px;line-height:1.5}
.ac{display:flex;gap:8px;margin-top:10px}.ac button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:12px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#23364a;color:#fff;padding:8px 16px;border-radius:99px;font-size:12px;z-index:20;display:none}
.stk{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 18px 8px;display:flex;gap:8px}
.stk input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}
.stk input:first-child{flex:1.2}.stk button{border:0;background:var(--blue);color:#fff;border-radius:12px;width:42px;font-size:20px;cursor:pointer}
.qrow{display:flex;gap:6px}.qrow select,.q2 select{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 4px;font-size:12.5px}
.q2 select{flex:0 0 66px}
.fl{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.tm{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.cd{font-size:14px;letter-spacing:.1em;color:var(--blue);font-weight:600}
.mid{text-align:center;color:var(--sub);font-size:11px;flex:1}.mid small{display:block;margin-top:2px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 0}
.fg input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;min-width:0}
.fg .w{grid-column:1/-1}.fg .lb{grid-column:1/-1;font-size:12px;color:var(--sub);margin-top:4px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--sub)}.fg label.w{grid-column:1/-1}
.fg textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;min-height:72px;resize:vertical}
.fb{display:flex;gap:8px;margin-top:10px}.fb button{flex:1;border:0;border-radius:12px;padding:12px;font-size:14px;cursor:pointer;background:var(--blue);color:#fff}.fb button.g{background:var(--blue2);color:var(--ink)}
.ac a{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:12px}
.md{z-index:12}
.wx{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid rgba(35,54,74,.1);font-size:12.5px;min-width:0}
.wx .ic{font-size:26px;line-height:1}.wx b{font-size:18px;font-weight:600}
.wx a{color:var(--ink);border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:99px;padding:3px 10px;font-size:11.5px}
.ch{display:flex;justify-content:space-between;align-items:center}
.ct{display:flex;align-items:center}.ct .x{margin:0;padding:4px 7px;font-size:14px}.ct .dl{color:#c0505f;font-size:12px}
.hd{cursor:grab;touch-action:none;padding:4px 8px;color:var(--sub);font-size:17px;line-height:1;user-select:none;-webkit-user-select:none}
.pi.drag{position:relative;z-index:6;filter:drop-shadow(0 8px 14px rgba(35,54,74,.2))}.pi.drag .card{border-color:var(--blue)}
.pi.over .card{outline:2px dashed var(--blue);outline-offset:2px}
.cnr{min-height:0}.cnr .rail:before{bottom:-2px}
.cn{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 0 8px;font-size:11.5px;color:var(--sub);cursor:pointer;min-width:0}
.tp{background:var(--blue2);color:var(--ink);padding:3px 9px;border-radius:99px;white-space:nowrap}.tp.on{background:var(--blue);color:#fff}.tp.none{background:none;border:1px dashed var(--line);color:var(--sub)}
.tp i{font-style:normal;opacity:.8;margin-left:4px}
.dist{font-style:normal;color:var(--sub)}
.fg select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;min-width:0}
.ac{flex-wrap:wrap}
.fn{font-size:12px;color:var(--sub);margin-top:2px}
.ad{font-size:11.5px;color:var(--sub);margin-top:6px;white-space:pre-line;line-height:1.5}
.dtl{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.dl2{display:flex;gap:10px;font-size:12px;line-height:1.6;margin-top:3px}.dl2 em{font-style:normal;color:var(--sub);flex:0 0 54px}.dl2 span{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:5px 12px;font-size:12px;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fn{font-size:11px;opacity:.9}

/* ===== 時尚微繽紛 theme ===== */
:root{--bg:#f5f9ff;--blue:#58a6ec;--blue2:#e0efff;--ink:#1f3350;--sub:#71849c;--line:#e3ecf8;--coral:#ff8fa6;--sun:#ffc65c;--mint:#4fd1b0;--lav:#a695f2;--peach:#ffb18a;--grad:linear-gradient(135deg,#58a6ec,#9a8bf2);--fd:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans TC",sans-serif;--fn:"Outfit",-apple-system,"Helvetica Neue",sans-serif}
body{background-color:var(--bg);background-image:radial-gradient(60% 34% at 100% 0%,#ffdfe7 0,rgba(255,223,231,0) 70%),radial-gradient(55% 30% at 0% 8%,#d3eaff 0,rgba(211,234,255,0) 70%),radial-gradient(50% 26% at 100% 62%,#fff0c9 0,rgba(255,240,201,0) 70%);background-repeat:no-repeat;background-attachment:fixed}
h1{font-family:var(--fd);font-weight:700;background:linear-gradient(90deg,#3b8fe0,#8d7bf0 55%,#ff7f9c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
header .sub{letter-spacing:.22em;font-family:var(--fn);font-size:10.5px;color:#8a9bb2}
.ib{border:0;box-shadow:0 6px 14px -8px rgba(60,90,140,.55)}
.ib:nth-child(1){background:#dff0ff}.ib:nth-child(2){background:#d8f6ec}.ib:nth-child(3){background:#ffe6d6}.ib:nth-child(4){background:#e8e3ff}
.hero{border:0;background:linear-gradient(135deg,#bfe0ff 0%,#dcd8ff 42%,#ffd6e1 78%,#ffe7b3 100%);box-shadow:0 14px 28px -16px rgba(88,166,236,.7)}
.hero:after{content:"";position:absolute;right:-34px;bottom:-46px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.38);pointer-events:none}
.hero b{font-family:var(--fd);font-size:17px;color:#1f3350}.hero p{color:#3b5273;font-size:13px}.hero .cake{font-size:40px;z-index:1}
.wx{border-top-color:rgba(255,255,255,.7)}.wx a{background:rgba(255,255,255,.75);border-color:transparent}
.day{--dc:#58a6ec;border:1.5px solid var(--line);border-radius:18px}
.day:before{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--dc);margin:0 auto 5px}
.day strong{font-family:var(--fn);font-weight:600}
.day.on{background:linear-gradient(160deg,var(--dc),color-mix(in srgb,var(--dc) 65%,#fff));border-color:var(--dc);box-shadow:0 10px 18px -10px var(--dc)}
.day.on:before{background:#fff}
.dtitle{font-family:var(--fd);font-size:16px}
.time{font-family:var(--fn);color:var(--ink);font-weight:500}
.rail:before{background:repeating-linear-gradient(to bottom,#c3d8f1 0 4px,transparent 4px 8px)}
.dot{box-shadow:0 0 0 1.5px var(--c),0 4px 8px -2px var(--c)}
.card{background:color-mix(in srgb,var(--c) 15%,#fff);border-color:color-mix(in srgb,var(--c) 45%,#fff);box-shadow:0 8px 18px -14px rgba(40,70,120,.45)}
.card h3{font-family:var(--fd);font-weight:700}
.tag{background:var(--c);color:#21324a;font-weight:600;opacity:1}
.panel,.pc{border-radius:22px;border-color:#e6eefa;box-shadow:0 10px 22px -16px rgba(60,90,140,.4)}
.h2{color:#6a7fa0;font-weight:600}
.go,.add button,.btn,.plus,.fb button,.lang button,.chip.on,.tp.on{background:var(--grad);border-color:transparent;color:#fff}
.fb button.g{background:var(--blue2);color:var(--ink)}
.chip{background:#fff}
.tp{background:#e3f1ff}
.tm{font-family:var(--fn)}.cd{font-family:var(--fn);color:#3b8fe0}
.total{font-family:var(--fn);font-size:26px;color:#3b8fe0}
.chk{border-color:var(--coral)}.row.on .chk{background:var(--coral)}
nav{border-radius:24px 24px 0 0;box-shadow:0 -12px 30px -20px rgba(60,90,140,.55);border-top:0}
nav button:nth-child(1){--c2:#3b8fe0}nav button:nth-child(2){--c2:#1fb58f}nav button:nth-child(3){--c2:#f2647f}nav button:nth-child(4){--c2:#d98a00}nav button:nth-child(5){--c2:#7d6ce6}
nav button.on{color:var(--c2)}nav button.on i{transform:translateY(-2px) scale(1.12)}
nav button i{transition:transform .2s}
a{color:#3b8fe0}
.hl{margin-top:8px;padding:8px 11px;border-radius:12px;background:linear-gradient(135deg,#fff3c4,#ffe0e8);border:1px solid #ffdca0;color:#4d3a12;font-size:12.5px;line-height:1.6;font-weight:500}
.est{margin:2px 22px 4px;display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px}
.est span{background:#fff2c9;border-radius:99px;padding:3px 11px;color:#5b4410}
.nvb{border:1px solid var(--line);background:var(--blue2);color:var(--ink)!important;border-radius:10px;padding:4px 10px;font-size:12px;white-space:nowrap}
.sechd{display:flex;align-items:center;gap:6px;width:calc(100% - 36px);margin:14px 18px 2px;background:none;border:0;padding:0;font-size:13px;color:#6a7fa0;font-weight:600;letter-spacing:.06em;cursor:pointer;text-align:left}
.tbar{display:flex;flex-wrap:wrap;gap:6px;padding:4px 18px 0}
.pc.cmp{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;font-size:13px}
.pc.cmp b{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%}
.pc.cmp .mt{color:var(--sub);font-size:11.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc.cmp.hid{opacity:.55;cursor:default}
.pc.cmp button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:4px 10px;font-size:12px;color:var(--ink);cursor:pointer}

/* ===== 淡雅化 + 精簡圖示按鈕 ===== */
.ac.ic{gap:6px;margin-top:8px;align-items:center}
.ac.ic button,.ac.ic a{width:30px;height:30px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1;background:transparent;border:1px solid var(--line);text-decoration:none;color:var(--sub)!important}
.ac.ic button:active,.ac.ic a:active{background:var(--blue2)}
:root{--bg:#f6f8fb;--blue:#7ea6c9;--blue2:#e6eef6;--ink:#2b3a4c;--sub:#7d8b9b;--line:#e6ebf1;--coral:#d9a3ad;--sun:#e3c98f;--mint:#9cc7b6;--lav:#b3aed4;--grad:linear-gradient(135deg,#86aed0,#a79fd0)}
body{background-image:radial-gradient(60% 30% at 100% 0%,#f6e6ea 0,rgba(246,230,234,0) 70%),radial-gradient(55% 26% at 0% 8%,#e3eef8 0,rgba(227,238,248,0) 70%)}
h1{background:linear-gradient(90deg,#5f8fbb,#8a84c4);-webkit-background-clip:text;background-clip:text}
.ib:nth-child(n){background:#edf2f7}
.ib{box-shadow:0 3px 8px -6px rgba(60,90,140,.4)}
.hero{background:linear-gradient(135deg,#e1edf8 0%,#e8e5f4 55%,#f6e7ea 100%);box-shadow:0 8px 18px -14px rgba(88,120,160,.5)}
.day.on{background:color-mix(in srgb,var(--dc) 55%,#8497ab);border-color:transparent;box-shadow:none}
.dot{box-shadow:0 0 0 1.5px var(--c)}
.card{background:color-mix(in srgb,var(--c) 7%,#fff);border-color:color-mix(in srgb,var(--c) 28%,#fff);box-shadow:none}
.tag{background:color-mix(in srgb,var(--c) 35%,#fff);font-weight:500}
.panel,.pc{box-shadow:0 4px 12px -10px rgba(60,90,140,.35)}
.hl{background:#fbf5e2;border-color:#f0e4bd;color:#5a4a22}
.est span{background:#f4efdc;color:#6a5a30}
.cd,.total{color:#5f8fbb}
a{color:#5f8fbb}
nav button:nth-child(n){--c2:#5f8fbb}
.rail:before{background:repeating-linear-gradient(to bottom,#d3dde9 0 4px,transparent 4px 8px)}
.mini{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:13px;line-height:1;padding:0;cursor:pointer;color:var(--sub)}

/* ===== Apple 風 毛玻璃(Liquid Glass) ===== */
:root{--glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.72);--gb:rgba(255,255,255,.65);--gs:0 8px 28px -12px rgba(40,60,90,.28),inset 0 1px 0 rgba(255,255,255,.8);--bl:saturate(180%) blur(22px);--ink:#1d1d1f;--sub:#6e6e73;--line:rgba(60,60,67,.12);--blue:#0a84ff;--fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","PingFang TC","Noto Sans TC",sans-serif;--fn:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;--grad:linear-gradient(180deg,#3d9bff,#0a7aef)}
html{background:#eef1f6 }
html{background-image:radial-gradient(38% 30% at 12% 10%,rgba(120,170,255,.50),transparent 70%),radial-gradient(34% 28% at 90% 22%,rgba(255,170,200,.42),transparent 70%),radial-gradient(40% 30% at 60% 70%,rgba(150,225,205,.38),transparent 70%),radial-gradient(30% 24% at 8% 80%,rgba(255,220,160,.36),transparent 70%);background-attachment:fixed;background-repeat:no-repeat}
body{background:transparent!important;background-image:none!important}
h1{background:none!important;-webkit-text-fill-color:var(--ink)!important;color:var(--ink)!important;letter-spacing:-.02em;font-weight:700}
header .sub{color:var(--sub);letter-spacing:.2em}
.ib,.ib:nth-child(n){background:var(--glass)!important;backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);border:1px solid var(--gb)!important;box-shadow:var(--gs)}
.hero{background:linear-gradient(135deg,rgba(255,255,255,.6),rgba(255,255,255,.28))!important;backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);border:1px solid var(--gb)!important;box-shadow:var(--gs);border-radius:26px}
.hero:after{background:radial-gradient(circle,rgba(255,255,255,.7),transparent 70%)}
.hero b{color:var(--ink);letter-spacing:-.01em}.hero p{color:#4a4a50}
.wx a{background:rgba(255,255,255,.6)}
.day{background:rgba(255,255,255,.66)!important;border:1px solid var(--gb)!important;box-shadow:var(--gs);color:var(--sub)}
.day.on{background:rgba(10,132,255,.88)!important;color:#fff!important;border-color:rgba(255,255,255,.35)!important;box-shadow:0 10px 22px -10px rgba(10,132,255,.7),inset 0 1px 0 rgba(255,255,255,.4)}
.day.on strong,.day.on *{color:#fff}
.card{background:var(--glass)!important;backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);border:1px solid var(--gb)!important;box-shadow:var(--gs)!important;border-radius:20px}
.pc,.panel{background:var(--glass)!important;backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);border:1px solid var(--gb)!important;box-shadow:var(--gs)!important;border-radius:22px}
.tag{background:color-mix(in srgb,var(--c) 28%,rgba(255,255,255,.7))!important;color:#3a3a3f;border:1px solid rgba(255,255,255,.7)}
.dot{box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.hl{background:rgba(255,236,170,.45)!important;border:1px solid rgba(255,255,255,.7)!important;color:#5a4a1c;backdrop-filter:blur(8px)}
.est span{background:rgba(255,255,255,.6);border:1px solid var(--gb);color:#5a5a60;backdrop-filter:blur(8px)}
.chip,.tp{background:var(--glass2)!important;border:1px solid var(--gb)!important;color:var(--ink);backdrop-filter:blur(10px)}
.chip.on,.tp.on,.go,.add button,.btn,.plus,.fb button,.lang button.on{background:var(--grad)!important;color:#fff!important;border:0!important;box-shadow:0 6px 14px -8px rgba(10,132,255,.8)}
.fb button.g,.go[style*="blue2"]{background:var(--glass2)!important;color:var(--ink)!important}
.add input,.add select,input,select,textarea{background:rgba(255,255,255,.7)!important;border:1px solid var(--line)!important;border-radius:12px;color:var(--ink)}
.ac button,.ac a,.ac.ic button,.ac.ic a,.nvb,.mini,.seg button{background:rgba(255,255,255,.6)!important;border:1px solid var(--gb)!important;color:var(--ink)!important}
.seg button.on{background:var(--blue)!important;color:#fff!important}
nav{background:rgba(255,255,255,.62)!important;backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);border-top:1px solid var(--gb)!important;box-shadow:0 -8px 30px -14px rgba(40,60,90,.35)!important;border-radius:26px 26px 0 0}
nav button:nth-child(n){--c2:var(--blue)}
.md{background:rgba(20,25,35,.28)!important;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet{background:rgba(250,250,253,.78)!important;backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);border-top:1px solid rgba(255,255,255,.8);box-shadow:0 -20px 50px -20px rgba(0,0,0,.35)}
.toast{background:rgba(30,30,34,.72)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.cd,.total{color:var(--blue)}a{color:var(--blue)}
.rail:before{background:repeating-linear-gradient(to bottom,rgba(60,60,67,.22) 0 4px,transparent 4px 8px)}
.h2,.sechd{color:var(--sub)}

.hero{padding:14px 16px 12px!important}
.hero .hr{display:flex;gap:12px;align-items:stretch}
.hero .hg{flex:1 1 50%;min-width:0;display:flex;flex-direction:column;justify-content:center}
.hero .hg b{font-size:15px;line-height:1.3}.hero .hg p{margin:4px 0 0;font-size:11.5px;line-height:1.5}
.hero .cdn{flex:1 1 50%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(255,255,255,.55);border:1px solid var(--gb);border-radius:18px;padding:8px 6px;position:relative;z-index:1}
.hero .cdn small{font-size:11px;color:var(--sub);letter-spacing:.06em}
.hero .cdn strong{font-size:34px;line-height:1.1;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.hero .cdn strong.go2{font-size:22px;margin:3px 0}
.hero .wx{margin-top:10px;padding-top:8px}

/* 右上角各面板:同款毛玻璃 */
.pg{background-color:#eef1f6!important;background-image:radial-gradient(38% 26% at 12% 8%,rgba(120,170,255,.50),transparent 70%),radial-gradient(34% 26% at 92% 20%,rgba(255,170,200,.42),transparent 70%),radial-gradient(40% 28% at 60% 62%,rgba(150,225,205,.38),transparent 70%),radial-gradient(30% 24% at 6% 88%,rgba(255,220,160,.36),transparent 70%)!important;background-repeat:no-repeat!important;background-attachment:local}
.pgh{position:sticky;top:0;z-index:3;margin:0;padding:14px 18px 10px;background:rgba(255,255,255,.45);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);border-bottom:1px solid var(--gb);letter-spacing:-.01em}
.pgh button{background:rgba(255,255,255,.7)!important;border:1px solid var(--gb)!important;box-shadow:var(--gs)}
.pgh .plus,#pgadd{background:var(--grad)!important;color:#fff!important;border:0!important}
.pg .pc{margin-left:18px;margin-right:18px}
.pg .pc.cmp{background:rgba(255,255,255,.5)!important}
.pg .fl .tm{letter-spacing:-.02em}
.pg .cd{color:var(--blue)}
.ac.ic button{white-space:nowrap;font-size:13px}
.pg .tbar .chip{background:rgba(255,255,255,.6)!important}
.pg .sechd{color:var(--sub)}
.pg .nt{color:var(--sub)}
.pg .src,.pg .dst{letter-spacing:-.01em}
.pg .panel{margin-left:18px;margin-right:18px}
.ac.ic button.dng{background:#ffe3e3!important;border-color:#f3b3b3!important}
</style>
</head>
<body>
<div id="app">
<header>
  <div><h1>福岡生日旅</h1><div class="sub">FUKUOKA BIRTHDAY TRIP</div></div>
  <div style="display:flex;gap:6px;align-items:center;margin-top:2px"><button class="ib" onclick="op('flight')" aria-label="航班">✈️</button><button class="ib" onclick="op('traffic')" aria-label="交通">🚇</button><button class="ib" onclick="op('stay')" aria-label="住宿">🏨</button><button class="ib" onclick="op('tr')" aria-label="翻譯">🌐</button></div>
</header>

<section class="view on" id="v-plan">
  <div class="hero"><div class="hr"><div class="hg"><b>🎂 Happy Birthday!</b><p>五天四夜，在日本慢慢逛、享受吃，開心過生日！</p></div><div class="cdn" id="cdn"></div></div><div class="wx" id="wx"></div></div>
  <div class="days" id="days"></div>
  <div class="dtitle"><span id="dt"></span><small id="dm"></small></div>
  <div class="est" id="est"></div>
  <div class="sec" style="padding-top:2px;padding-bottom:0"><button class="chip" onclick="tshow()">⚙︎ 卡片顯示內容</button><div class="chips" id="shp" style="display:none"></div></div>
  <div class="tl" id="tl"></div>
  <div class="sec"><button class="go" style="width:100%;margin:2px 0 0;background:var(--blue2);color:var(--ink)" onclick="pform()">＋ 新增行程</button></div>
</section>

<section class="view" id="v-list">
  <div class="stk"><input id="c_t" placeholder="待辦項目名稱"><input id="c_n" placeholder="細項備註"><button onclick="cadd()" aria-label="新增">＋</button></div>
  <div class="panel" id="chk"></div>
</section>

<section class="view" id="v-shop">
  <div class="h2">🛍 購物清單</div>
  <div class="panel" id="shl"></div>
  <div class="sec"><div class="add"><input id="i_shop" placeholder="新增想買的東西…"><button onclick="la('shop')">新增</button></div></div>
  <div class="h2">🗺 備用景點</div>
  <div class="panel" id="spl"></div>
  <div class="sec"><div class="add col"><input id="i_spot" placeholder="新增備用景點…"><input id="i_spotn" placeholder="細項 / 備註(例:為什麼推薦、營業時間、怎麼去)"><input id="i_spotu" placeholder="導航連結(選填,留空自動用名稱搜尋)"><button onclick="la('spot')">新增</button></div></div>
</section>

<section class="view" id="v-spend">
  <div class="total" id="tot">NT$0</div>
  <div class="sub" style="padding:2px 22px" id="totsub"></div>
  <div class="panel">
    <div class="kv"><em>匯率 1 日圓 =</em><span><input id="rateIn" type="number" step="0.0001" inputmode="decimal" class="dt" style="width:84px" onchange="setRate(this.value)"> 台幣</span></div>
    <div class="kv"><em>快速換算 ¥</em><span><input id="cv" type="number" inputmode="decimal" class="dt" style="width:100px" oninput="cvt()"> ≈ <b id="cvo">NT$0</b></span></div>
  </div>
  <div class="days" id="sdays"></div>
  <div class="panel">
    <div class="qrow"><select id="q_who" onchange="selq('who')"></select><select id="q_pay" onchange="selq('pay')"></select><select id="q_cat"></select></div>
    <div class="add" id="qa" style="display:none"><input id="qai"><button onclick="qok()">新增</button><button style="background:var(--sub)" onclick="$('qai').value='';qok()">取消</button></div>
    <div class="add q2"><input id="q_n" placeholder="項目"><input id="q_a" type="number" inputmode="decimal" placeholder="金額" style="max-width:84px" oninput="qprev()"><select id="q_cur" onchange="qprev()"><option>JPY</option><option>TWD</option></select><button onclick="addSp()">記帳</button></div>
    <div class="add" style="padding-top:0"><input id="q_nt" placeholder="備註(選填)"></div>
    <div style="padding:0 0 8px"><button class="chip" id="spb" onclick="spt()">👥 分帳</button><div class="chips" id="spp" style="display:none"></div></div>
    <div class="sub" id="qp" style="padding-bottom:6px;white-space:pre-line"></div>
  </div>
  <div class="dtitle"><span id="sdt"></span><small id="sdsub"></small></div>
  <div class="panel" id="sl"></div>
  <div class="h2">每日統計</div><div class="panel" id="sum"></div>
  <div class="h2">付款人統計</div><div class="panel" id="wsum"></div>
  <div class="h2">分帳結算(台幣)</div><div class="panel" id="stl"></div>
</section>

<section class="view" id="v-info">
  <div id="inf"></div>
  <div class="h2">出發日期</div>
  <div class="panel"><div class="kv"><em>第 1 天</em><input type="date" id="sd" class="dt" onchange="sds(this.value)"></div></div>
</section>

<nav id="nav">
  <button class="on" data-v="plan"><i>🗓</i>行程</button>
  <button data-v="list"><i>✅</i>To Do</button>
  <button data-v="shop"><i>🛍</i>購物・備案</button>
  <button data-v="spend"><i>💴</i>記帳</button>
  <button data-v="info"><i>🧭</i>資訊</button>
</nav>
<div class="pg" id="pg"><div class="pgw">
  <div class="pgh"><button onclick="bk()" aria-label="返回">‹</button><span id="pgt"></span><button id="pgadd" onclick="nf()" style="margin-left:auto;background:var(--blue);color:#fff;border:0;font-size:22px" aria-label="新增">＋</button></div>
  <div id="pg-trip">
    <div id="ml" style="padding:4px 0"></div>
  </div>
  <div id="pg-tr">
    <div class="lang"><select id="sfl" onchange="setL('f',this.value)"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select><button onclick="swp()" aria-label="互換">⇄</button><select id="stl" onchange="setL('t',this.value)"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select></div>
